# M3A API Deployment + NodePort Service (namespace m3a).
#
# Image: localhost/m3a-api:dev, loaded into kind with `kind load image-archive` (never
# pulled from a registry, hence imagePullPolicy: Never).
# Reachable from the host at http://127.0.0.1:8080 via kind.yaml (host 8080 -> 30080).
#
# Replicas are managed by kubernetes/api-hpa.yml. Re-applying this file resets the
# Deployment to 1 replica until the HPA scales it again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3a-api
  namespace: m3a
  labels:
    app.kubernetes.io/name: m3a-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: m3a-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m3a-api
    spec:
      containers:
        - name: api
          image: localhost/m3a-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: m3a-app-config
            - secretRef:
                name: m3a-app-db
          # Traces go to Tempo (kubernetes/monitoring/tempo.yml). Without Tempo deployed the
          # exporter only logs export failures; metrics at /metrics are unaffected.
          # Sampling: add OTEL_TRACES_SAMPLER=parentbased_traceidratio, OTEL_TRACES_SAMPLER_ARG=0.1.
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            # The image is ReadyToRun-compiled (Containerfile.api); without the instrumented PGO
            # tier, hot methods are recompiled once instead of twice. Under a 100m CPU limit the
            # JIT competes with requests for the same quota (docs/stress-test/REPORT.md, phase 5).
            - name: DOTNET_TieredPGO
              value: "0"
            # Npgsql's default pool is 100 connections per Pod, but PostgreSQL accepts 100 in total
            # (97 for non-superusers). With 4 replicas under overload the pools outgrew that and
            # Postgres refused connections ("remaining connection slots are reserved"), turning
            # into 500s and failed readiness. 20 per Pod keeps 4 replicas at 80. A Pod at 100m
            # cannot use more than a handful at once anyway. (docs/stress-test/REPORT.md, phase 8)
            - name: ConnectionStrings__DefaultConnection
              value: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USERNAME};Password=${DB_PASSWORD};Maximum Pool Size=20
          # Readiness checks the database: an unreachable DB takes the Pod out of the Service
          # without restarting it. Liveness only checks the process, so a DB outage never
          # causes a restart loop. See src/M3A.Api/Extensions/HealthCheckExtensions.cs.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Capped at 10% of a core. The HPA's 40% target is relative to the request: ~40m per Pod.
          # 256Mi: with GET /tickets?eventId= the working set stays ~100Mi under load (it reached
          # 512Mi and was OOMKilled when every call returned the whole tickets table).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: m3a-api
  namespace: m3a
  labels:
    app.kubernetes.io/name: m3a-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: m3a-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
