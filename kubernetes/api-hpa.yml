# Scales m3a-api between 1 and 3 Pods, targeting 40% of each Pod's *requested* CPU
# (250m in api.yml -> ~100m per Pod), averaged across Pods. Needs Metrics Server.
# Only Pods scale; the single kind node must have room for the extra replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: m3a-api
  namespace: m3a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: m3a-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
